name: "Transifex sync"

on:
  workflow_call:
    secrets:
      transifex-token:
        required: true
      github-token:
        required: true

jobs:
  transifex-sync:
    name: "Sync locales with Transifex"
    runs-on: "ubuntu-latest"
    container:
      image: "ghcr.io/glpi-project/githubactions-glpi-apache:latest"
      options: --user 1001 # using built-in image user, otherwise GitHub Actions can't write file to the container
    steps:

    - name: "Checkout setup.php"
      uses: "actions/checkout@v7"
      with:
        sparse-checkout: setup.php
        path: tmp_setup

    - name: "Get Plugin Key"
      run: |
        PLUGIN_KEY=$(sed --quiet 's/.*function plugin_version_\([a-z0-9_]\+\).*/\1/p' tmp_setup/setup.php | head --lines=1)
        if [ -z "$PLUGIN_KEY" ]; then
          echo "Could not extract plugin key from setup.php"
          exit 1
        fi
        echo "PLUGIN_KEY=$PLUGIN_KEY" >> $GITHUB_ENV

    - name: "Checkout Plugin"
      uses: "actions/checkout@v7"

    - name: "Link Plugin to GLPI"
      run: |
        sudo ln -s $GITHUB_WORKSPACE /var/www/glpi/plugins/$PLUGIN_KEY
        # Fix permissions for logs and other writable dirs
        # Open the whole tree for writing so any tool (present or future) can write wherever it needs to.
        sudo mkdir -p /var/www/glpi/tests/files/_log
        sudo chmod -R a+rwX /var/www/glpi/
        # Ensure git trusts the directory
        git config --global --add safe.directory '*'

    - name: "Extract locales"
      working-directory: /var/www/glpi/
      run: |
        php bin/console tools:locales:extract --plugin=$PLUGIN_KEY

    - name: "Push source file"
      uses: "transifex/cli-action@v2"
      with:
        args: "push"
        token: "${{ secrets.transifex-token }}"

    - name: "Clean tmp directory"
      run: |
        rm -fr /tmp/tx

    - name: "Pull translations"
      uses: "transifex/cli-action@v2"
      with:
        args: "pull --force --all --minimum-perc=80"
        token: "${{ secrets.transifex-token }}"

    - name: "Compile MO files"
      working-directory: /var/www/glpi/
      run: |
        php bin/console tools:locales:compile --plugin=$PLUGIN_KEY

    - name: "Debug git status"
      run: |
        ls -la locales/
        git status -u

    - name: "Check status"
      id: "check-status"
      # en_GB.mo file will always be considered as updated as it is regenerated by the ./vendor/bin/extract-locales command.
      # It have to be ignore to prevent "empty" PRs to be generated.
      run: |
        if [ -n "$(git status --porcelain locales/*.mo ':(exclude)locales/en_GB.mo')" ]; then
          echo "CREATE_PR=yes" >> $GITHUB_OUTPUT
        else
          echo "CREATE_PR=no" >> $GITHUB_OUTPUT
        fi

    - name: "Create pull request"
      if: ${{ steps.check-status.outputs.CREATE_PR == 'yes' }}
      uses: "peter-evans/create-pull-request@v7"
      with:
        commit-message: "Update locales"
        branch: "i18n-updates"
        branch-suffix: "timestamp"
        add-paths: "locales/"
        labels: "i18n"
        delete-branch: true
        title: "Chore(i18n): update translations"
        body: "Auto-updated translations files"
        # A PAT is required.
        # From https://docs.github.com/en/actions/using-workflows/triggering-a-workflow#triggering-a-workflow-from-a-workflow:
        # > When you use the repository's GITHUB_TOKEN to perform tasks, events triggered by the GITHUB_TOKEN,
        # > with the exception of workflow_dispatch and repository_dispatch, will not create a new workflow run.
        # > This prevents you from accidentally creating recursive workflow runs. For example, if a workflow run pushes
        # > code using the repository's GITHUB_TOKEN, a new workflow will not run even when the repository
        # > contains a workflow configured to run when push events occur.
        token: ${{ secrets.github-token }}
